# .github/workflows/ci.yml for gymkartel-backend
name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # graphql-inspector needs history to diff against the base
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build contracts (SDL + types consumed by api/app)
        run: pnpm --filter @gymkartel/contracts build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests (Docker-free tier)
        run: pnpm -r test
      # Integration + load tiers are NOT run per-PR (see nightly.yml); they gate
      # the release train, not individual PRs.

  schema-check:
    # Blocks a breaking GraphQL change that isn't accompanied by a major bump.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: graphql-inspector diff (base -> head)
        run: |
          git show origin/${{ github.base_ref }}:packages/contracts/src/schema.graphql > /tmp/base.graphql || echo "no base schema"
          npx --yes @graphql-inspector/cli diff /tmp/base.graphql packages/contracts/src/schema.graphql

  integration:
    # Nightly / pre-release only: real containers via Testcontainers.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (Testcontainers)
        run: pnpm --filter @gymkartel/api test

  publish-contracts:
    # Publishes @gymkartel/contracts on a release via changesets.
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm -r --filter @gymkartel/contracts publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
